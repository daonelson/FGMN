<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Dhamma Talk
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

:root{

--ink:#f1d7a6;
--ink-soft:#c9a878;
--gold:#c6a15b;
--gold-dark:#9b783b;

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

background:
linear-gradient(
180deg,
#3b2a1d 0%,
#24170f 100%
);

color:var(--ink);

font-family:"EB Garamond",serif;

line-height:1.75;

}


.container{

margin:auto;

padding:50px 24px 80px;

text-align:center;

}



.wheel{

width:88px;

margin-bottom:40px;

opacity:.95;

}



.library-divider{

width:170px;

height:1px;

background:var(--gold);

margin:35px auto;

}



.page-title{

font-size:2.4rem;

font-weight:500;

margin-bottom:10px;

}



.subtitle{

font-size:1.5rem;

color:var(--ink-soft);

}



.return-link{

margin-top:40px;

}


.return-link a{

text-decoration:none;

color:var(--ink-soft);

letter-spacing:.08em;

font-size:1.25rem;

}


.return-link a:hover{

color:var(--gold-dark);

}



</style>

</head>


<body>


<div class="container">


<img
src="dhammawheel.png"
class="wheel"
alt="Dhamma Wheel">


<div class="library-divider"></div>


<h1 class="page-title">

Dhamma Talk

</h1>


<p class="subtitle">

Loading...

</p>


<div class="library-divider"></div>


<div id="talks">

</div>


<div class="library-divider"></div>


<div class="return-link">

<a href="prototype/viewer.html">

Return

</a>

</div>


</div>

<script>

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");


fetch("data/dhammatalks.json")

.then(response => response.json())

.then(data => {


let sutta = data[id];


document.querySelector(".page-title").textContent =
sutta.title;


document.querySelector(".subtitle").textContent =
sutta.subtitle;


});


</script>
  
</body>

</html>
