<script>

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");

fetch("data/dhammatalks.json")

.then(response => response.json())

.then(data => {

let sutta =
data[id];

if(!sutta){

document.querySelector(".page-title").textContent =
"Audio Reading Not Found";

document.querySelector(".subtitle").textContent =
"";

return;

}

document.querySelector(".page-title").textContent =
sutta.title;

document.title =
sutta.title;

document.querySelector(".subtitle").textContent =
sutta.subtitle;

document.getElementById("return").href =
"prototype/viewer.html?id=" + id;

let container =
document.getElementById("talks");

sutta.dhammaTalks.forEach((talk,index)=>{

let title =
document.createElement("h2");

title.className="subtitle";

title.textContent =
index === 0
? "Audio Reading"
: "Audio Reading " + (index + 1);

container.appendChild(title);

let source =
document.createElement("p");

source.className="subtitle";

source.textContent =
"Read by " + talk.source;

container.appendChild(source);

let iframe =
document.createElement("iframe");

let url =
talk.url;

if(url.includes("watch?v=")){

url =
url.replace("watch?v=","embed/");

}

if(url.includes("youtu.be/")){

url =
url.replace("youtu.be/","www.youtube.com/embed/");

}

iframe.src =
url;

iframe.className =
"video-frame";

iframe.allowFullscreen =
true;

container.appendChild(iframe);

if(index < sutta.dhammaTalks.length - 1){

let divider =
document.createElement("div");

divider.className =
"library-divider";

container.appendChild(divider);

}

});

});

</script>
