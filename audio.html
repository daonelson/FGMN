<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Audio Reading
</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

:root{

--ink:#f1d7a6;
--ink-soft:#c9a878;
--gold:#c6a15b;
--gold-dark:#9b783b;

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

background:
linear-gradient(
180deg,
#3b2a1d 0%,
#24170f 100%
);

color:var(--ink);

font-family:"EB Garamond",serif;

line-height:1.75;

}


.container{

margin:auto;

padding:50px 24px 80px;

text-align:center;

}


.wheel{

width:88px;

margin-bottom:40px;

opacity:.95;

}


.library-divider{

width:170px;

height:1px;

background:var(--gold);

margin:35px auto;

}


.page-title{

font-size:2.4rem;

font-weight:500;

margin-bottom:10px;

}


.subtitle{

font-size:1.5rem;

color:var(--ink-soft);

}


.audio-box{

max-width:700px;

margin:30px auto;

}


.audio-box p{

font-size:1.2rem;

color:var(--ink-soft);

margin-bottom:15px;

}


audio{

width:100%;

}


.return-link{

margin-top:40px;

}


.return-link a{

text-decoration:none;

color:var(--ink-soft);

letter-spacing:.08em;

font-size:1.25rem;

}


.return-link a:hover{

color:var(--gold-dark);

}


@media(max-width:600px){

.page-title{

font-size:2rem;

}


.subtitle{

font-size:1.25rem;

}

}

</style>

</head>


<body>


<div class="container">


<img
src="dhammawheel.png"
class="wheel"
alt="Dhamma Wheel">


<div class="library-divider"></div>


<h1 class="page-title">

Loading...

</h1>


<p class="subtitle">

</p>


<div class="library-divider"></div>


<div id="readings">


</div>


<div class="library-divider"></div>


<div class="return-link">

<a id="return" href="prototype/viewer.html">

Return

</a>

</div>


</div>



<script>


const params =
new URLSearchParams(window.location.search);


const id =
params.get("id");



fetch("data/audio.json")


.then(response => response.json())


.then(data => {


const sutta =
data[id];


if(!sutta){


document.querySelector(".page-title").textContent =
"Audio Reading Not Found";


return;


}



document.querySelector(".page-title").textContent =
sutta.title;



document.title =
sutta.title;



document.querySelector(".subtitle").textContent =
sutta.subtitle;



document.getElementById("return").href =
"prototype/viewer.html?id=" + id;



const container =
document.getElementById("readings");



sutta.audioReadings.forEach((reading,index)=>{


let box =
document.createElement("div");


box.className =
"audio-box";



let title =
document.createElement("h2");


title.className =
"subtitle";


title.textContent =
index === 0
? "Audio Reading"
: "Audio Reading " + (index + 1);


box.appendChild(title);

let info =
document.createElement("p");


info.innerHTML =
"Read by: " + reading.source +
"<br>" +
"Translator: " + reading.translator +
"<br><br>" +
"Please refer to the Copyright section of the Preface for licensing information and attribution details.";


box.appendChild(info);



let audio =
document.createElement("audio");


audio.controls =
true;


let source =
document.createElement("source");


source.src =
reading.url;


source.type =
"audio/mpeg";


audio.appendChild(source);


box.appendChild(audio);



container.appendChild(box);



if(index < sutta.audioReadings.length - 1){


let divider =
document.createElement("div");


divider.className =
"library-divider";


container.appendChild(divider);


}



});


})


.catch(error=>{


console.log(error);


});


</script>


</body>

</html>
