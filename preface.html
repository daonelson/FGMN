<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Preface — A Field Guide to the Majjhima Nikāya & Selected Buddhist Writings
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

:root{

--ink:#e6c995;
--ink-soft:#d5b783;

--gold:#c5a56a;
--gold-dark:#9f7b3f;

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

background:
linear-gradient(
180deg,
#5a4026 0%,
#3f2d1c 100%
);

color:var(--ink);

font-family:"EB Garamond",serif;

line-height:1.75;

}


.container{

max-width:900px;

margin:auto;

padding:50px 24px 80px;

text-align:center;

}


.wheel{

width:88px;

margin-bottom:35px;

opacity:.95;

}


.library-divider{

width:170px;

height:1px;

background:var(--gold);

margin:35px auto;

}


.title{

font-size:2.4rem;

font-weight:500;

margin-bottom:35px;

}


.page{

display:block;

width:min(800px,100%);

margin:40px auto;

border-radius:4px;

}


.return-link{

margin-top:45px;

}


.return-link a{

font-size:1rem;

letter-spacing:.08em;

text-decoration:none;

color:var(--ink-soft);

transition:.2s;

}


.return-link a:hover{

color:var(--gold);

}


</style>

</head>


<body>


<div class="container">


<img
src="dhammawheel.png"
class="wheel"
alt="Dhamma Wheel">


<div class="library-divider"></div>


<div class="title">

Preface

</div>


<div class="library-divider"></div>


<div id="pages"></div>



<div class="library-divider"></div>


<div class="return-link">

<a href="introductionvideo.html">

Return

</a>

</div>


</div>



<script>

const images = [

"visual-companions/preface/01.webp",
"visual-companions/preface/02.webp",
"visual-companions/preface/03.webp",
"visual-companions/preface/04.webp",
"visual-companions/preface/05.webp",
"visual-companions/preface/06.webp",
"visual-companions/preface/07.webp",
"visual-companions/preface/08.webp",
"visual-companions/preface/09.webp",
"visual-companions/preface/10.webp",
"visual-companions/preface/11.webp",
"visual-companions/preface/12.webp"

];


const pages = document.getElementById("pages");


images.forEach((src, index) => {


const img = document.createElement("img");


img.src = src;

img.className = "page";

img.alt = `Preface page ${index + 1}`;


pages.appendChild(img);


});


</script>


</body>

</html>
