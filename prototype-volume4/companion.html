<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Visual Companion
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap"
rel="stylesheet">


<style>

:root{

--ink:#f1d7a6;
--ink-soft:#c9a878;
--gold:#c6a15b;
--gold-dark:#9b783b;

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

background:
linear-gradient(
180deg,
#3b2a1d 0%,
#24170f 100%
);

color:var(--ink);

font-family:"EB Garamond",serif;

line-height:1.75;

overflow-x:auto;

}


.container{

margin:auto;

padding:50px 24px 80px;

text-align:center;

}



.wheel{

width:88px;

margin-bottom:40px;

opacity:.95;

}



.library-divider{

width:170px;

height:1px;

background:var(--gold);

margin:35px auto;

}



.page-title{

font-size:2.4rem;

font-weight:500;

margin-bottom:10px;

color:var(--ink);

}



#controls{

position:sticky;

top:0;

background:#3b2a1d;

padding:12px;

margin-bottom:20px;

z-index:1000;

}



button{

font-size:18px;

padding:8px 16px;

margin:0 8px;

cursor:pointer;

font-family:"EB Garamond",serif;

background:#24170f;

color:var(--ink);

border:1px solid var(--gold);

}



#zoomLabel{

font-size:18px;

display:inline-block;

width:70px;

color:var(--ink);

}



.page{

width:900px;

max-width:none;

height:auto;

display:block;

margin:40px auto;

transition:.15s;

}



.return-link{

margin-top:40px;

}



.return-link a{

text-decoration:none;

color:var(--ink-soft);

letter-spacing:.08em;

font-size:1.25rem;

}



.return-link a:hover{

color:var(--gold-dark);

}



@media(max-width:600px){

#controls{

display:none;

}


.page-title{

font-size:2rem;

}


.page{

width:100%;

max-width:100%;

height:auto;

margin:30px auto;

}

}


</style>

</head>



<body>


<div class="container">


<img
src="../dhammawheel.png"
class="wheel"
alt="Dhamma Wheel">


<div class="library-divider"></div>


<h1 class="page-title" id="title">

Loading...

</h1>


<div class="library-divider"></div>


<div id="controls">

<button onclick="toggleFullscreen()">⛶</button>

<button onclick="zoomOut()">−</button>

<span id="zoomLabel">100%</span>

<button onclick="zoomIn()">+</button>

</div>



<div id="pages"></div>



<div class="library-divider"></div>


<div class="return-link">

<a id="return">

Return

</a>

</div>


</div>



<script>


let zoom = 100;



function updateZoom(){


document.getElementById("zoomLabel").textContent =
zoom + "%";


document.querySelectorAll(".page").forEach(img=>{


img.style.width =
(900 * zoom / 100) + "px";


});


}



function zoomIn(){


if(zoom < 250){

zoom += 10;

updateZoom();

}


}



function zoomOut(){


if(zoom > 50){

zoom -= 10;

updateZoom();

}


}



function toggleFullscreen(){


if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}

else{

document.exitFullscreen();

}


}



const params =
new URLSearchParams(window.location.search);


const id =
params.get("id");



const companions = {

"IV1": {

"title":
"AN 5.57 — Upajjhaṭṭhana Sutta",

"folder":
"https://daonelson.github.io/FGMN-Media-04/visual-companions/IV-1/",

"pages": [

"01.webp",
"02.webp",
"03.webp",
"04.webp",
"05.webp",
"06.webp",
"07.webp",
"08.webp",
"09.webp",
"10.webp",
"11.webp",
"12.webp",
"13.webp",
"14.webp",
"15.webp"

]

}

};



const item =
companions[id];



if(!item){

document.getElementById("title").textContent =
"Selection not found";

}

else{


document.getElementById("title").textContent =
item.title;


document.title =
item.title;



document.getElementById("return").href =
"viewer.html?id=" + id;



const container =
document.getElementById("pages");



item.pages.forEach(page=>{


const img =
document.createElement("img");


img.className =
"page";


img.src =
item.folder + page;


img.alt =
item.title;


container.appendChild(img);


});



updateZoom();

}


</script>


</body>

</html>
